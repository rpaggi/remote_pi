# Build de DEV do Cockpit pra macOS e Windows, sem assinatura/notarização.
#
# macOS: existe porque o workflow oficial (cockpit-release.yml) exige o
# certificado Developer ID + credenciais de notarização do mantenedor
# original, que não existem neste fork (secrets nunca são herdados por
# forks). Este job gera um .app/.dmg funcional pra uso local — sem
# Gatekeeper feliz (primeira abertura precisa de "clique direito > Abrir" ou
# `xattr -cr`), mas sem precisar de conta Apple Developer nenhuma.
#
# Windows: o job oficial NÃO usa assinatura/certificado nenhum (só
# fastforge + Inno Setup, que já vem no runner) — reaproveitado quase
# igual, só sem a validação de tag/versão do job `meta` do release oficial.
#
# Uso: Actions -> "cockpit-dev-build" -> Run workflow -> baixa o artefato
# (cockpit-dev-macos-arm64 ou cockpit-dev-windows-x64) ao final.

name: cockpit-dev-build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/commit a buildar"
        required: false
        default: "main"

jobs:
  macos:
    name: macOS (arm64, sem assinatura)
    runs-on: macos-14
    defaults:
      run:
        working-directory: cockpit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      # Zig 0.16.0 EXATO — o hook de build do libghostty exige essa versão
      # (minimum_zig_version do ghostty); 0.15.x falha.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # A CLI interna (cockpit/cli, crate Rust) é compilada por um Run Script
      # phase do Xcode durante o build do app.
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update || true
          rustup default stable
          cargo --version

      - name: flutter pub get
        run: flutter pub get

      # A config Release do target Runner usa CODE_SIGN_STYLE = Automatic sem
      # DEVELOPMENT_TEAM (diferente da config Debug, que tem o Developer ID do
      # mantenedor original hardcoded) — builda "Sign to Run Locally" sem
      # precisar de nenhuma conta Apple. Por isso --release aqui, não --debug.
      - name: flutter build macos --release
        run: flutter build macos --release

      - name: Empacota .dmg (sem assinar)
        run: |
          APP="build/macos/Build/Products/Release/Cockpit.app"
          test -d "$APP" || {
            echo "::error::app não encontrado em $APP"
            ls -la build/macos/Build/Products/Release/ || true
            exit 1
          }
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          hdiutil create -volname "Remote Pi Cockpit (dev)" -srcfolder "$STAGE" \
            -ov -format UDZO "dist/Cockpit-dev-macos-arm64.dmg"
          rm -rf "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-dev-macos-arm64
          path: cockpit/dist/*.dmg
          retention-days: 14
          if-no-files-found: error

  windows:
    name: Windows (x64, sem assinatura)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cockpit
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      # Mesma versão fixa do job macOS — o hook do libghostty exige 0.16.0.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Prepara Fastforge e Inno Setup
        run: |
          dart pub global activate fastforge
          echo "C:\\Program Files (x86)\\Inno Setup 6" >> "$GITHUB_PATH"

      - name: Build + empacota (sem assinar)
        run: |
          flutter pub get
          flutter build windows --release
          # Gate do sidecar: sem o bundle do cockpit-server o app cai no
          # fallback in-process silenciosamente (mesmo gate do release oficial).
          SRV="build/windows/x64/runner/Release/cockpit-server-bundle/bin"
          test -x "$SRV/cockpit-server.exe" || {
            echo "::error::cockpit-server.exe ausente do bundle Windows"; exit 1; }
          test -f "$SRV/cockpit_pty.dll" || {
            echo "::error::cockpit_pty.dll ausente do bundle do servidor"; exit 1; }
          dart pub global run fastforge:main package --platform windows --targets exe
          EXE=$(find dist -name "*.exe" | head -1)
          test -n "$EXE"
          mkdir -p out
          mv "$EXE" "out/RemotePiCockpit-Setup-dev-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-dev-windows-x64
          path: cockpit/out/*.exe
          retention-days: 14
          if-no-files-found: error
